<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Study Track</title>
  <!-- A lap of the track, with the leading runner at the head of the distance
       covered. One ring and one dot, so it still reads at 16px. -->
  <rect width="32" height="32" rx="9" fill="url(#g)"/>
  <rect x="7.5" y="10" width="17" height="12" rx="6"
        fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="2.4"/>
  <path d="M13.5 10h5a6 6 0 0 1 6 6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="24.5" cy="16" r="2.9" fill="#fff"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7A4D"/>
      <stop offset="1" stop-color="#E8402A"/>
    </linearGradient>
  </defs>
</svg>
